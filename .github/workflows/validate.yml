name: Validate application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: reporta_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: migrations_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U reporta_test -d migrations_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:all -- --runInBand
      - run: npm test -- --runInBand migrations-bootstrap
        env:
          MIGRATIONS_TEST_URL: postgres://reporta_test:test_only@localhost:5432/migrations_test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false --runInBand --coverage
      - run: npm run build
